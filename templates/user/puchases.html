{% extends 'index.html' %}
{% load static %}
{% block content %}
    <section class="ftco section">

<main class="container my-4">
	<!-- Featured Products -->
<h3 class="my-4 border-bottom pb-1 card-header" >Visualisation <i class="fa fa-area-chart"></i></h3>
	<div class="row">
		<div class="col-md-3">
			{% include 'user/user-sidebar.html' %}
		</div>
		<div class="col-md-9">
			<div>
                   <div class="card mb-4">
                    <p class="lead text-center mb-0" style="text-align: center" >Purchases in (GHC)</p>

 <hr />

			  <canvas id="myChart"></canvas>
			</div>
		</div>
        <hr/>

        </div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script type="text/javascript" >
	const labels = {{monthNumber|safe}};



	const data = {
	  labels: labels,
	  datasets: [{
	    label: 'Total Money Recieved By Month',
	       backgroundColor: 'rgb(198,99,255)',
      borderColor: 'rgb(255, 99, 132)',
          marginLeft:35,


	    data: {{totalpayments}},
	  }]
	};

	const config = {
	  type: 'bar',
	  data,
	  options: {}
	};

    const myChart = new Chart(
        document.getElementById('myChart'),
        config
    );

</script>
    </section>


{% endblock %}
